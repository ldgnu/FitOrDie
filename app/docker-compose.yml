# FitOrDie — un solo servicio (Go + SQLite). Sin Postgres, sin Node.
name: fitordie

services:
  fitordie:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: fitordie:latest
    container_name: fitordie
    restart: unless-stopped
    # NO se publica en 0.0.0.0: el tráfico público entra SOLO por Cloudflare
    # Tunnel -> NPM (nginx-proxy) sobre la red docker `proxy`, que resuelve el
    # nombre `fitordie` por DNS interno. Quedan bindings locales/Tailscale para
    # debug y healthchecks manuales.
    ports:
      - "127.0.0.1:3007:3007"
      - "100.100.210.126:3007:3007"   # Tailscale (solo tailnet)
    networks:
      - default
      - proxy
    env_file:
      - .env
    environment:
      DB_PATH: /data/fitordie.db
      ADDR: 0.0.0.0:3007
      TZ_NAME: America/Argentina/Cordoba
      GOMEMLIMIT: 64MiB
      GOGC: "50"
    volumes:
      # SQLite persistente (el CSV va embebido en el binario).
      - fitordie-data:/data
    mem_limit: 128m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/app/fitordie", "health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  fitordie-data:

networks:
  # Red compartida con nginx-proxy / cloudflared (creada por el stack del homelab).
  proxy:
    external: true

