services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitordie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitordie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fitordie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fitordie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fitordie}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
