services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitordie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitordie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # solo dev local; en prod el .env decide
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fitordie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fitordie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fitordie}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Visión autocontenida (servidor propio, sin Ollama en el host):
  # docker compose --profile vision up -d con OLLAMA_URL=http://ollama:11434,
  # luego: docker compose exec ollama ollama pull moondream.
  # Sin ese perfil, la carga por foto funciona en modo manual.
  ollama:
    image: ollama/ollama:latest
    profiles: [vision]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pgdata:
  uploads:
  ollama-data:
